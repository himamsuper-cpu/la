name: Android APK Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        run: npm run android:sync && cd android && ./gradlew assembleDebug

      - name: Prepare release asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Noom-Launcher-${GITHUB_REF_NAME}-Android.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Noom Launcher ${{ github.ref_name }}
          generate_release_notes: true
          files: Noom-Launcher-${{ github.ref_name }}-Android.apk