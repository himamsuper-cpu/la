name: Android APK Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag to build and publish
        required: true
        type: string
        default: v1.5.0-beta
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        run: npm run android:sync && cd android && ./gradlew assembleDebug

      - name: Prepare release asset
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Noom-Launcher-${RELEASE_TAG}-Android.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Noom Launcher ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: Noom-Launcher-${{ inputs.release_tag || github.ref_name }}-Android.apk