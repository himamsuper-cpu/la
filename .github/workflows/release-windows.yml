name: Windows Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Windows release tag
        required: true
        type: string
        default: windows-v2.1.0-beta.1
  push:
    tags:
      - 'windows-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out Moon Launcher
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Resolve release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^windows-v', ''
          $isPrerelease = $version -match '-beta\.\d+$'
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "IS_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Check out pinned XMCL runtime
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'xmcl'
          git clone --filter=blob:none https://github.com/Voxelum/x-minecraft-launcher.git $source
          git -C $source checkout 9f1354bd6dc74e76ef9eebcb6a424f48bf3ca064
          "XMCL_SOURCE=$source" >> $env:GITHUB_ENV

      - name: Install XMCL workspace dependencies
        shell: pwsh
        run: |
          Set-Location $env:XMCL_SOURCE
          pnpm install --frozen-lockfile

      - name: Apply Moon branding and license notices
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node windows/rebrand-xmcl.mjs "$env:XMCL_SOURCE" "$env:RELEASE_TAG"

      - name: Build Windows installer
        shell: pwsh
        run: |
          Set-Location $env:XMCL_SOURCE
          pnpm run build:renderer
          $env:BUILD_TARGET = 'windows'
          pnpm run build
          $destination = Join-Path $env:GITHUB_WORKSPACE 'windows/dist'
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item 'xmcl-electron-app/build/output/*.exe' $destination
          Copy-Item 'xmcl-electron-app/build/Moon-Third-Party-Notices.txt' $destination

      - name: Sign and verify Windows installer
        if: ${{ !contains(inputs.release_tag || github.ref_name, '-beta.') }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            throw 'Set WINDOWS_SIGNING_CERT_BASE64 and WINDOWS_SIGNING_CERT_PASSWORD in repository Actions secrets before releasing.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            throw 'WINDOWS_SIGNING_CERT_PASSWORD is missing.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'moon-code-signing.pfx'
          try {
            $certificateBytes = [Convert]::FromBase64String(($env:WINDOWS_SIGNING_CERT_BASE64 -replace '\s', ''))
            [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

            $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
            $sdkBin = Join-Path $programFilesX86 'Windows Kits\10\bin'
            $signTool = Get-ChildItem -Path $sdkBin -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw 'Windows SDK signtool.exe was not found.' }

            $installers = @(Get-ChildItem -Path 'windows/dist' -Filter '*.exe' | Sort-Object Name)
            if ($installers.Count -ne 1) { throw "Expected one x64 installer, found $($installers.Count)." }
            $installer = $installers | Where-Object { $_.Name -match '-x64\.exe$' }
            if (-not $installer) { throw 'Missing x64 installer.' }

            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr 'http://timestamp.digicert.com' /f $certificatePath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /d 'Moon Launcher x64' $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed for x64.' }

            & $signTool.FullName verify /pa /all /v $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed for x64; release was stopped.' }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonLauncher-v${{ env.RELEASE_VERSION }}-Windows
          path: windows/dist/*

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Moon Launcher v${{ env.RELEASE_VERSION }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: windows/dist/*